<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Clinician Seat in Three Cases</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Hebrew:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a short film in four scenes. Each case reads left to right: what the patient sent → what the agent checks → what happens next. Single dark look, made for screen recording. */
:root{
  color-scheme:dark;
  --bg:#0E1522; --panel:#162033; --panel-2:#1E2B44; --line:#2C3A55; --ink:#F1F4F8; --muted:#A6B2C6;
  --accent:#5EC2C6; --ask:#9DB5F5; --retake:#F2A679; --manual:#F29AA5; --warn:#E9C46A; --ok:#7FD39E;
  --sans:'IBM Plex Sans','IBM Plex Sans Hebrew',Arial,sans-serif; --he:'IBM Plex Sans Hebrew','IBM Plex Sans',Arial,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45}
.stage{max-width:1240px;margin:0 auto;min-height:100%;padding-block:22px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.eyebrow{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}
.controls{display:flex;gap:8px;align-items:center}
.controls button{font:inherit;font-size:14px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer}
.controls button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dots{display:flex;gap:6px}
.dots span{width:30px;height:5px;border-radius:3px;background:var(--line)}
.dots span.on{background:var(--accent)}
.head{display:flex;flex-direction:column;gap:6px}
.title{font-size:34px;font-weight:600;text-wrap:balance;line-height:1.15}
.lead{font-size:19px;color:var(--muted);max-width:70ch}
.scene{display:grid;grid-template-columns:1fr auto 1.2fr auto 1fr;gap:12px;align-items:stretch}
.arrow{align-self:center;color:var(--line);font-size:28px}
.col{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.h{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600}
.pid{font-family:var(--mono);font-size:15px;color:var(--muted)}
.who{font-size:20px;font-weight:600}
.photo{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:4/3;max-width:100%;background:#000}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo.dark img{filter:brightness(.28)}
.photo .tag{position:absolute;left:8px;bottom:8px;font-size:13px;background:rgba(14,21,34,.85);border-radius:6px;padding:3px 9px}
.answers{display:flex;flex-wrap:wrap;gap:6px}
.ans{font-size:13px;border:1px solid var(--line);border-radius:6px;padding:2px 8px;color:var(--muted)}
.ans.yes{color:var(--ink);border-color:var(--accent);background:rgba(94,194,198,.12)}
.note{font-size:15px;background:var(--panel-2);border-radius:8px;padding:8px 10px}
.note .lab{font-size:12px;color:var(--muted);display:block}
.step{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;opacity:.25;transition:opacity .4s}
.step.on{opacity:1}
.mark{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--bg)}
.step.on .mark{background:var(--accent);border-color:var(--accent)}
.step.on.alert .mark{background:var(--warn);border-color:var(--warn)}
.q{font-size:17px;font-weight:600}
.a{font-size:15px;color:var(--muted)}
.step.on.alert .a{color:var(--warn)}
.quote{font-size:14px;border-left:3px solid var(--accent);padding-left:10px;margin-top:4px}
.src{font-size:12px;color:var(--accent)}
.out{opacity:.25;transition:opacity .4s}
.out.on{opacity:1}
.stamp{font-size:24px;font-weight:700;border-radius:12px;padding:12px;text-align:center}
.s-ask{background:rgba(157,181,245,.14);color:var(--ask);border:1px solid var(--ask)}
.s-retake{background:rgba(242,166,121,.14);color:var(--retake);border:1px solid var(--retake)}
.s-manual{background:rgba(242,154,165,.14);color:var(--manual);border:1px solid var(--manual)}
.phone{background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:6px}
.bubble{font-family:var(--he);direction:rtl;text-align:right;font-size:19px;background:var(--panel-2);border-radius:14px 14px 4px 14px;padding:10px 12px;align-self:flex-end;max-width:100%}
.tr{font-size:13px;color:var(--muted);text-align:right}
.plain{font-size:16px}
.fix{font-size:15px;color:var(--bg);background:var(--warn);border-radius:10px;padding:10px 12px;font-weight:500}
.never{font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.intro,.finale{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.big{font-size:28px;font-weight:600;text-wrap:balance;line-height:1.25}
.flow{display:flex;flex-direction:column;gap:10px}
.fl{display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:center;background:var(--panel-2);border-radius:10px;padding:12px 14px;font-size:17px}
.fl b{font-family:var(--mono);color:var(--accent);font-size:20px}
.lst{display:flex;flex-direction:column;gap:6px}
.li{display:grid;grid-template-columns:28px 92px 1fr;gap:10px;align-items:center;background:var(--panel-2);border-radius:8px;padding:7px 10px;font-size:15px}
.li .r{font-family:var(--mono);color:var(--muted)}
.li .i{font-family:var(--mono)}
.li .d{justify-self:end;font-size:13px;border-radius:999px;padding:2px 10px;white-space:nowrap;color:var(--accent);border:1px solid var(--accent)}
.li .d.off{color:var(--muted);border-color:var(--line)}
.foot{color:var(--muted);font-size:12px}
@media (max-width:900px){.scene,.intro,.finale{grid-template-columns:1fr}.arrow{display:none}}
@media (prefers-reduced-motion:reduce){.step,.out{transition:none}}
</style>
<div class="stage">
  <div class="top">
    <div class="eyebrow">Skin Lesion Triage · the agent at work</div>
    <div class="controls"><div class="dots" id="dots"></div><button id="play">Pause</button><button id="restart">Restart</button></div>
  </div>
  <div class="head"><div class="title" id="title"></div><div class="lead" id="lead"></div></div>
  <div id="view"></div>
  <div class="foot">Made-up test patients; the agent’s answers come from its run on 29.10.2026, after the code rules. Photos for illustration only: PAD-UFES-20 (Pacheco et al., CC BY 4.0); the second one is darkened to show a poor photo.</div>
</div>

      <div class="fl" style="opacity:${tick>=1?1:.3}"><b>2</b><span>Two models score the risk and rank the list</span></div>
      <div class="fl" style="opacity:${tick>=2?1:.3}"><b>3</b><span>The agent checks each case and prepares the next step</span></div>
    </div></div></div>`;
}
function caseView(c){
  const n = c.steps.length, fixAt = n, stampAt = n + (c.fix?1:0), outAt = stampAt + 1;
  return `<div class="scene">
    <div class="col"><div class="h">What the patient sent</div>
      <div><div class="who">Age ${esc(c.who)}</div><div class="pid">${c.id} · rank ${c.rank} on today’s list</div></div>
      <div class="photo ${c.dark?'dark':''}"><img src="${c.img}" alt="Skin lesion photo"><span class="tag">${esc(c.tag)}</span></div>
      <div class="answers">${Object.keys(SYM).map(s=>`<span class="ans ${c.yes.includes(s)?'yes':''}">${SYM[s]}: ${c.yes.includes(s)?'yes':'no'}</span>`).join("")}</div>
      <div class="note"><span class="lab">Patient’s note</span>${c.note?esc(c.note):"(none)"}</div>
    </div>
    <div class="arrow">→</div>
    <div class="col"><div class="h">What the agent checks</div>
      ${c.steps.map((s,i)=>`<div class="step ${tick>i?'on':''} ${s[2]?'alert':''}"><div class="mark">${s[2]?'!':'✓'}</div><div><div class="q">${esc(s[0])}</div>${s[1]!==null?`<div class="a">${esc(s[1])}</div>`:(tick>i?`<div class="quote">“${esc(c.quote)}”<div class="src">${esc(c.src)}</div></div>`:"")}</div></div>`).join("")}
      ${c.fix && tick>fixAt ? `<div class="fix">${esc(c.fix)}</div>` : ""}
    </div>
    <div class="arrow">→</div>
    <div class="col out ${tick>stampAt?'on':''}"><div class="h">What happens next</div>
      <div class="stamp ${c.stamp[1]}">${esc(c.stamp[0])}</div>
      ${c.msg ? `<div class="phone"><div class="h" style="color:var(--muted)">Message to the patient</div><div class="bubble">${esc(c.msg)}</div><div class="tr">${esc(c.tr)}</div></div>` : ""}
      <div class="plain" style="opacity:${tick>outAt?1:.25}">${esc(c.plain)}</div>
      <div class="never">The risk score and the patient’s place on the list never change.</div>
    </div></div>`;
}
function finaleView(){
  const off = tick >= 1;
  return `<div class="finale">
    <div class="col"><div class="h">${off?'Agent switched off':'Today’s list, agent on'}</div>
      <div class="lst">${LIST.map(l=>`<div class="li"><span class="r">${l[0]}</span><span class="i">${l[1]}</span><span class="d ${off?'off':''}">${off?'Model evidence only':esc(l[2])}</span></div>`).join("")}</div></div>
    <div class="col" style="justify-content:center;gap:16px"><div class="big">${off?'Same patients, same order. Nothing is lost.':'Ten patients, each with one clear next step.'}</div>
      <div class="lead">${off?'If the agent fails or is switched off, every case still reaches the dermatologist with the model’s evidence. The agent adds the questions, the photo requests and the guideline quotes.':'And if the agent is not there?'}</div></div>
  </div>`;
}
const TITLES = {intro:["Skin Lesion Triage","Three patients from today’s list, and what the agent does with each."], finale:["Without the agent","The list does not depend on it."]};
function render(){
  const s = SCENES[scene];
  const t = s.k==="case" ? [s.c.title, s.c.lead] : TITLES[s.k];
  document.getElementById("title").textContent = t[0];
  document.getElementById("lead").textContent = t[1];
  document.getElementById("view").innerHTML = s.k==="intro" ? introView() : s.k==="case" ? caseView(s.c) : finaleView();
  document.getElementById("dots").innerHTML = SCENES.map((_,i)=>`<span class="${i<=scene?'on':''}"></span>`).join("");
  const done = scene===SCENES.length-1 && tick>=SCENES[scene].ticks-1;
  document.getElementById("play").textContent = playing ? "Pause" : (done ? "Replay" : "Play");
}
function step(){
  tick++;
  if(tick >= SCENES[scene].ticks){
    if(scene < SCENES.length-1){ scene++; tick = 0; }
    else { tick = SCENES[scene].ticks-1; playing = false; clearInterval(timer); }
  }
  render();
}
function start(){ clearInterval(timer); playing = true; timer = setInterval(step, STEP_MS); render(); }
document.getElementById("play").onclick = () => {
  if(playing){ playing = false; clearInterval(timer); render(); return; }
  if(scene===SCENES.length-1 && tick>=SCENES[scene].ticks-1){ scene=0; tick=0; }
  start();
};
document.getElementById("restart").onclick = () => { scene=0; tick=0; start(); };
document.addEventListener("keydown", e => {
  if(e.key==="ArrowRight"){ playing=false; clearInterval(timer); step(); }
  if(e.key===" "){ e.preventDefault(); document.getElementById("play").click(); }
});
start();
</script>

</body></html>
